name: Publish to Docker

on:
  release:
    branches: main
    types:
      - published
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  publish-docker-images:
    runs-on: ubuntu-latest

    steps:
      - name: Get latest tag
        uses: oprypin/find-latest-tag@v1
        with:
          repository: Huaqiu-Electronics/kicad-issue-cn
          releases-only: true
        id: latest-release

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Aliyun credentials
        env:
          ACR_USER: liuweijian@1613452717930870.onaliyun.com
          ACR_PASS: ${{ secrets.ALIYUNCS_DOCKER_PASSWORD_LWJ }}
        run: |
          echo "username=$ACR_USER"
          echo "password_chars=$(printf '%s' "$ACR_PASS" | wc -c)"
          code=$(curl -s -o /dev/null -w '%{http_code}' -u "$ACR_USER:$ACR_PASS" "https://dockerauth.cn-hangzhou.aliyuncs.com/auth?service=registry.aliyuncs.com:cn-shanghai:26842&scope=repository:lwj-kicad/kicad-issue-cn:pull,push")
          echo "token_endpoint_status=$code"

      - name: Login to Aliyun
        uses: docker/login-action@v3
        with:
          registry: registry.cn-shanghai.aliyuncs.com
          username: liuweijian@1613452717930870.onaliyun.com
          password: ${{ secrets.ALIYUNCS_DOCKER_PASSWORD_LWJ }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            registry.cn-shanghai.aliyuncs.com/lwj-kicad/kicad-issue-cn
            ghcr.io/${{ github.repository }}
          tags: |
            ${{ steps.latest-release.outputs.tag }}
            latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GITLAB_TOKEN=${{ secrets.GITLAB_TOKEN }}