name: Publish to Docker

on:
  release:
    branches: main
    types:
      - published
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  publish-docker-images:
    runs-on: ubuntu-latest

    steps:
      - name: Get latest tag
        uses: oprypin/find-latest-tag@v1
        with:
          repository: Huaqiu-Electronics/kicad-issue-cn
          releases-only: true
        id: latest-release

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun
        env:
          ACR_HOST: crpi-uk7yo7mxz74rkbcy.cn-shanghai.personal.cr.aliyuncs.com
          ACR_USER: liuweijian@1613452717930870
          ACR_PASS: ${{ secrets.ALIYUNCS_DOCKER_PASSWORD_LWJ }}
        run: |
          mkdir -p ~/.docker
          [ -f ~/.docker/config.json ] || echo '{"auths":{}}' > ~/.docker/config.json
          auth=$(printf '%s:%s' "$ACR_USER" "$ACR_PASS" | base64 -w0)
          jq --arg h "$ACR_HOST" --arg a "$auth" '.auths[$h] = {"auth": $a}' ~/.docker/config.json > /tmp/config.json
          mv /tmp/config.json ~/.docker/config.json

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            crpi-uk7yo7mxz74rkbcy.cn-shanghai.personal.cr.aliyuncs.com/lwj-kicad/kicad-issue-cn
            ghcr.io/${{ github.repository }}
          tags: |
            ${{ steps.latest-release.outputs.tag }}
            latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GITLAB_TOKEN=${{ secrets.GITLAB_TOKEN }}